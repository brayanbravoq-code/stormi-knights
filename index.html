<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Volleyball Match Sign-Up</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header -->
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-volleyball text-amber-500" aria-hidden="true"></i> Court Roster Sign-Up
        </h1>
        <p class="text-sm text-slate-500">Sign up for a specific position and match date.</p>
      </div>

      <!-- Date Selector and Creator -->
      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <select id="dateSelect" aria-label="Select match date" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-amber-500 focus:border-amber-500 p-2.5 font-medium"></select>
        <button id="newDateBtn" type="button" onclick="openNewDateModal()" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition-colors flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> New Date
        </button>

        <!-- Auth / Captain Controls -->
        <button id="authBtn" onclick="authAction()" class="ml-2 bg-amber-50 hover:bg-amber-100 text-amber-700 text-sm font-semibold px-3 py-2 rounded-lg border border-amber-200 flex items-center gap-2">
          <i class="fa-solid fa-user-shield"></i> Captain Login
        </button>

        <div id="adminControls" class="hidden ml-2 flex items-center gap-2">
          <label class="flex items-center gap-2 text-xs">
            <input id="lockToggle" type="checkbox" onchange="toggleLockDate(this.checked)" />
            <span class="text-slate-600">Lock date (no new signups)</span>
          </label>
          <button id="logoutBtn" onclick="signOut()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs px-3 py-2 rounded border border-rose-200">Logout</button>
        </div>
      </div>
    </header>

    <!-- Match Status Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-4">
        <span class="text-sm font-semibold text-slate-600">Capacity:</span>
        <div class="w-48 bg-slate-200 rounded-full h-3 overflow-hidden">
          <div id="capacityBar" class="bg-amber-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <span id="capacityText" class="text-sm font-bold text-slate-700">0 / 12 Spots Filled</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="copyRosterToClipboard()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-lg border border-slate-300 flex items-center gap-1.5 transition">
          <i class="fa-regular fa-copy"></i> Copy Lineup
        </button>
        <button onclick="downloadRoster()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-lg border border-slate-300 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-download"></i> Export JSON
        </button>
        <label for="importFile" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-lg border border-slate-300 flex items-center gap-1.5 transition cursor-pointer">
          <i class="fa-solid fa-upload"></i> Import
        </label>
        <input id="importFile" type="file" accept="application/json" class="hidden" onchange="importRosterFile(event)" />
        <button onclick="clearCurrentDateRoster()" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-lg border border-rose-200 transition">
          Reset Date
        </button>
      </div>
    </div>

    <!-- Teams Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Team A -->
      <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="bg-sky-600 p-4 text-white flex justify-between items-center">
          <h2 class="font-bold tracking-wide flex items-center gap-2">
            <span class="w-3 h-3 bg-sky-200 rounded-full inline-block" aria-hidden="true"></span> Team Blue
          </h2>
          <span id="teamACount" class="text-xs font-semibold bg-sky-700 px-2 py-1 rounded">0/6</span>
        </div>
        <div id="teamASlots" class="p-4 divide-y divide-slate-100" role="list"></div>
      </section>

      <!-- Team B -->
      <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="bg-emerald-600 p-4 text-white flex justify-between items-center">
          <h2 class="font-bold tracking-wide flex items-center gap-2">
            <span class="w-3 h-3 bg-emerald-200 rounded-full inline-block" aria-hidden="true"></span> Team Green
          </h2>
          <span id="teamBCount" class="text-xs font-semibold bg-emerald-700 px-2 py-1 rounded">0/6</span>
        </div>
        <div id="teamBSlots" class="p-4 divide-y divide-slate-100" role="list"></div>
      </section>

    </div>
  </div>

  <!-- Sign Up Modal -->
  <div id="signupModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50" role="dialog" aria-modal="true">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4">
      <div>
        <h3 class="text-lg font-bold text-slate-900" id="modalSlotTitle">Claim Position</h3>
        <p class="text-xs text-slate-500" id="modalSlotSubtitle">Enter your details to reserve this spot.</p>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Player Name</label>
        <input type="text" id="playerNameInput" placeholder="e.g. Alex Johnson" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-amber-500 focus:border-amber-500" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeSignupModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</button>
        <button onclick="confirmSignup()" class="px-4 py-2 text-sm bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg transition">Confirm Spot</button>
      </div>
    </div>
  </div>

  <!-- Add Date Modal -->
  <div id="newDateModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50" role="dialog" aria-modal="true">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4">
      <h3 class="text-lg font-bold text-slate-900">Add Match Date</h3>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Match Date</label>
        <input type="date" id="newDateInput" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-amber-500" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeNewDateModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</button>
        <button onclick="addNewDate()" class="px-4 py-2 text-sm bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg transition">Add Date</button>
      </div>
    </div>
  </div>

  <script>
    // ====== CONFIG - replace with your Supabase project values ======
    const SUPABASE_URL = 'https://miwgkjygmthhzfuamvua.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pd2dranlnbXRoaHpmdWFtdnVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5ODk1MTIsImV4cCI6MjEwNzU2NTUxMn0[...]';
    // =================================================================

    const useSupabase = SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_URL.includes('REPLACE_WITH');
    let supabase = null;

    if (useSupabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const POSITIONS = [
      { id: "S", name: "Setter", icon: "fa-crosshairs", desc: "Playmaker / Target" },
      { id: "OH1", name: "Outside Hitter 1", icon: "fa-bolt", desc: "Primary Pin Attacker" },
      { id: "OH2", name: "Outside Hitter 2", icon: "fa-bolt", desc: "Passer / Left Pin" },
      { id: "MB1", name: "Middle Blocker 1", icon: "fa-shield", desc: "Quick Attack & Block" },
      { id: "MB2", name: "Middle Blocker 2", icon: "fa-shield", desc: "Quick Attack & Block" },
      { id: "OPP_LIB", name: "Opposite / Libero", icon: "fa-shield-halved", desc: "Right Pin or Defense" }
    ];

    // Local fallback store for when Supabase is not configured (keeps previous localStorage behavior)
    let store = JSON.parse(localStorage.getItem('vb_roster_data')) || { dates: ["2026-10-20", "2026-10-27"], signups: {}, locks: {}, captainPass: null };

    let currentDate = store.dates[0] || new Date().toISOString().split('T')[0];
    let selectedSlot = null;
    let isAdmin = false;
    let realtimeChannels = [];

    function saveStore() { localStorage.setItem('vb_roster_data', JSON.stringify(store)); }

    function migrateStore() {
      Object.keys(store.signups || {}).forEach(date => {
        ['teamA', 'teamB'].forEach(team => {
          const teamMap = store.signups[date][team] || {};
          Object.keys(teamMap).forEach(pos => {
            const v = teamMap[pos];
            if (typeof v === 'string') teamMap[pos] = { name: v, status: 'approved' };
          });
          store.signups[date][team] = teamMap;
        });
      });
    }
    migrateStore();

    // --- Supabase helpers ---
    async function fetchDatesRemote() {
      // prefer a dedicated dates table so locks live there
      const { data, error } = await supabase.from('dates').select('date').order('date');
      if (error) throw error;
      return data.map(r => r.date);
    }

    async function fetchSignupsRemote(date) {
      const { data, error } = await supabase.from('signups').select('*').eq('date', date);
      if (error) throw error;
      // convert list to nested shape
      const obj = { teamA: {}, teamB: {} };
      data.forEach(r => {
        obj[r.team][r.position] = { id: r.id, name: r.player, status: r.status };
      });
      return obj;
    }

    async function fetchLockRemote(date) {
      const { data, error } = await supabase.from('dates').select('locked').eq('date', date).maybeSingle();
      if (error) throw error;
      return data ? !!data.locked : false;
    }

    async function isUserAdminRemote(email) {
      const { data, error } = await supabase.from('admins').select('email').eq('email', email).maybeSingle();
      if (error) return false;
      return !!data;
    }

    async function setupRealtime(date) {
      // unsubscribe first
      realtimeChannels.forEach(ch => ch.unsubscribe());
      realtimeChannels = [];

      const signupsChannel = supabase.channel('public:signups')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'signups', filter: `date=eq.${date}` }, payload => {
          // refresh the UI for the current date
          if (payload) renderSlots();
        })
        .subscribe();
      realtimeChannels.push(signupsChannel);

      const datesChannel = supabase.channel('public:dates')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'dates', filter: `date=eq.${date}` }, payload => {
          // lock changed
          renderSlots();
        })
        .subscribe();
      realtimeChannels.push(datesChannel);
    }

    // --- UI and data layer ---
    async function init() {
      if (useSupabase) {
        // check auth state
        supabase.auth.onAuthStateChange(async (event, session) => {
          const user = session?.user ?? null;
          if (user) {
            isAdmin = await isUserAdminRemote(user.email);
            document.getElementById('authBtn').textContent = (isAdmin ? 'Captain: ' : 'User: ') + user.email;
            document.getElementById('adminControls').classList.toggle('hidden', !isAdmin);
            await loadRemoteData(currentDate);
          } else {
            isAdmin = false;
            document.getElementById('authBtn').textContent = 'Captain Login';
            document.getElementById('adminControls').classList.add('hidden');
            await loadRemoteData(currentDate);
          }
        });

        // initial load
        await loadRemoteDates();
        await loadRemoteData(currentDate);
        await setupRealtime(currentDate);
      } else {
        populateDateDropdown();
        renderSlots();
      }

      // register service worker
      if ('serviceWorker' in navigator) navigator.serviceWorker?.register('/sw.js').catch(()=>{});
    }

    async function loadRemoteDates() {
      try {
        const dates = await fetchDatesRemote();
        if (dates && dates.length) {
          store.dates = dates;
          saveStore();
          populateDateDropdown();
        }
      } catch (e) {
        console.error('fetchDatesRemote', e);
      }
    }

    async function loadRemoteData(date) {
      try {
        const signups = await fetchSignupsRemote(date);
        store.signups[date] = signups;
        store.locks[date] = await fetchLockRemote(date);
        saveStore();
        populateDateDropdown();
        renderSlots();
      } catch (e) {
        console.error('loadRemoteData', e);
      }
    }

    function populateDateDropdown() {
      const select = document.getElementById('dateSelect');
      select.innerHTML = '';
      store.dates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        if (d === currentDate) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = async (e) => {
        currentDate = e.target.value;
        if (useSupabase) {
          await loadRemoteData(currentDate);
          await setupRealtime(currentDate);
          document.getElementById('lockToggle').checked = !!store.locks[currentDate];
        } else {
          renderSlots();
        }
      };
    }

    function renderSlots() {
      const teamASlots = document.getElementById('teamASlots');
      const teamBSlots = document.getElementById('teamBSlots');
      teamASlots.innerHTML = '';
      teamBSlots.innerHTML = '';

      if (!store.signups[currentDate]) store.signups[currentDate] = { teamA: {}, teamB: {} };

      let filledCount = 0; let teamACount = 0; let teamBCount = 0;
      POSITIONS.forEach(pos => {
        const playerA = store.signups[currentDate].teamA[pos.id];
        if (playerA && playerA.status === 'approved') { filledCount++; teamACount++; }
        if (playerA && playerA.status === 'pending') { teamACount++; }
        teamASlots.appendChild(createSlotElement('teamA', pos, playerA));

        const playerB = store.signups[currentDate].teamB[pos.id];
        if (playerB && playerB.status === 'approved') { filledCount++; teamBCount++; }
        if (playerB && playerB.status === 'pending') { teamBCount++; }
        teamBSlots.appendChild(createSlotElement('teamB', pos, playerB));
      });

      document.getElementById('teamACount').innerText = `${teamACount}/${POSITIONS.length}`;
      document.getElementById('teamBCount').innerText = `${teamBCount}/${POSITIONS.length}`;
      document.getElementById('capacityText').innerText = `${filledCount} / ${POSITIONS.length * 2} Spots Filled`;
      const pct = Math.round((filledCount / (POSITIONS.length * 2)) * 100);
      document.getElementById('capacityBar').style.width = `${pct}%`;

      // update admin UI lock state
      if (useSupabase) document.getElementById('lockToggle').checked = !!store.locks[currentDate];
      document.getElementById('adminControls').classList.toggle('hidden', !isAdmin);
    }

    function createSlotElement(team, pos, player) {
      const div = document.createElement('div');
      div.className = "py-3 flex items-center justify-between";

      const leftSide = document.createElement('div');
      leftSide.className = "flex items-center gap-3";
      leftSide.innerHTML = `
        <div class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center text-sm" aria-hidden="true">
          <i class="fa-solid ${pos.icon}"></i>
        </div>
        <div>
          <div class="text-sm font-bold text-slate-800">${pos.name}</div>
          <div class="text-xs text-slate-400">${pos.desc}</div>
        </div>
      `;

      const rightSide = document.createElement('div');
      rightSide.className = "flex items-center gap-2";

      const isLocked = !!store.locks[currentDate];

      if (player) {
        const nameSpan = document.createElement('span');
        nameSpan.className = "text-sm font-semibold text-slate-900 bg-slate-100 px-3 py-1 rounded-md border border-slate-200 flex items-center gap-2";
        nameSpan.textContent = player.name;

        const statusBadge = document.createElement('span');
        statusBadge.className = player.status === 'approved' ? 'text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded' : 'text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded';
        statusBadge.textContent = player.status === 'approved' ? 'Approved' : 'Pending';

        const dropBtn = document.createElement('button');
        dropBtn.title = "Drop out";
        dropBtn.className = "text-slate-400 hover:text-rose-500 p-1.5 transition";
        dropBtn.innerHTML = '<i class="fa-solid fa-trash-can text-sm"></i>';
        dropBtn.onclick = () => {
          if (isLocked && !isAdmin) return alert('Date is locked — contact a captain to remove');
          removeSignup(team, pos.id, player.id);
        };

        rightSide.appendChild(nameSpan);
        rightSide.appendChild(statusBadge);

        if (player.status === 'pending' && isAdmin) {
          const approveBtn = document.createElement('button');
          approveBtn.className = 'text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-1 rounded';
          approveBtn.textContent = 'Approve';
          approveBtn.onclick = () => approveSignup(team, pos.id, player.id);
          rightSide.appendChild(approveBtn);

          const rejectBtn = document.createElement('button');
          rejectBtn.className = 'text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-2 py-1 rounded border border-rose-200';
          rejectBtn.textContent = 'Reject';
          rejectBtn.onclick = () => { if (confirm('Reject this signup?')) removeSignup(team, pos.id, player.id); };
          rightSide.appendChild(rejectBtn);
        } else {
          rightSide.appendChild(dropBtn);
        }

      } else {
        const signupBtn = document.createElement('button');
        signupBtn.className = "text-xs font-bold text-amber-600 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-3 py-1.5 rounded-lg transition";
        signupBtn.textContent = "Sign Up";
        if (isLocked && !isAdmin) {
          signupBtn.disabled = true;
          signupBtn.classList.add('opacity-50','cursor-not-allowed');
          signupBtn.title = 'Date locked — awaiting captain approval';
        } else {
          signupBtn.onclick = () => openSignupModal(team, pos.id, pos.name);
        }
        rightSide.appendChild(signupBtn);
      }

      div.appendChild(leftSide);
      div.appendChild(rightSide);
      div.setAttribute('role', 'listitem');
      return div;
    }

    // --- Signup actions (use Supabase when configured) ---
    async function confirmSignup() {
      const name = document.getElementById('playerNameInput').value.trim();
      if (!name) return alert("Please enter your name");
      const status = (useSupabase && isAdmin) ? 'approved' : 'pending';

      if (useSupabase) {
        const payload = { date: currentDate, team: selectedSlot.team, position: selectedSlot.posId, player: name, status };
        const { data, error } = await supabase.from('signups').insert(payload).select().single();
        if (error) return alert('Signup failed: ' + error.message);
        // local store will be updated via realtime subscription
      } else {
        if (!store.signups[currentDate]) store.signups[currentDate] = { teamA: {}, teamB: {} };
        store.signups[currentDate][selectedSlot.team][selectedSlot.posId] = { name, status };
        saveStore();
        renderSlots();
      }

      closeSignupModal();
    }

    async function approveSignup(team, posId, id) {
      if (!useSupabase || !isAdmin) return alert('Only a captain can approve');
      const { error } = await supabase.from('signups').update({ status: 'approved' }).eq('id', id);
      if (error) return alert('Approve failed: ' + error.message);
    }

    async function removeSignup(team, posId, id) {
      if (useSupabase) {
        const { error } = await supabase.from('signups').delete().eq('id', id);
        if (error) return alert('Remove failed: ' + error.message);
      } else {
        if (!store.signups[currentDate]) return;
        delete store.signups[currentDate][team][posId];
        saveStore();
        renderSlots();
      }
    }

    async function toggleLockDate(locked) {
      if (!useSupabase) {
        store.locks[currentDate] = locked; saveStore(); renderSlots(); return;
      }
      if (!isAdmin) return alert('Only a captain can lock or unlock dates');
      // upsert into dates table
      const { error } = await supabase.from('dates').upsert({ date: currentDate, locked }).select();
      if (error) return alert('Lock update failed: ' + error.message);
    }

    // --- Dates management ---
    async function addNewDate() {
      const dateVal = document.getElementById('newDateInput').value;
      if (!dateVal) return alert('Choose a date');
      if (useSupabase) {
        // insert into dates table if not exists
        const { error } = await supabase.from('dates').upsert({ date: dateVal, locked: false });
        if (error) return alert('Add date failed: ' + error.message);
        await loadRemoteDates();
      } else {
        if (!store.dates.includes(dateVal)) { store.dates.push(dateVal); store.dates.sort(); saveStore(); populateDateDropdown(); }
      }
      currentDate = dateVal;
      document.getElementById('dateSelect').value = dateVal;
      closeNewDateModal();
      if (useSupabase) { await loadRemoteData(currentDate); await setupRealtime(currentDate); }
      renderSlots();
    }

    async function loadRemoteData(date) { if (useSupabase) await loadRemoteData(date); }

    function openNewDateModal() { document.getElementById('newDateModal').classList.remove('hidden'); }
    function closeNewDateModal() { document.getElementById('newDateModal').classList.add('hidden'); }
    function openSignupModal(team, posId, posName) { selectedSlot = { team, posId }; document.getElementById('modalSlotTitle').innerText = `${posName}`; document.getElementById('modalSlotSubtitle').innerText = `${team === 'teamA' ? 'Team Blue' : 'Team Green'} • ${currentDate}`; document.getElementById('playerNameInput').value = ''; document.getElementById('signupModal').classList.remove('hidden'); setTimeout(()=> document.getElementById('playerNameInput').focus(), 50); }
    function closeSignupModal() { document.getElementById('signupModal').classList.add('hidden'); selectedSlot = null; }

    // --- Auth actions ---
    async function authAction() {
      if (!useSupabase) return alert('Supabase not configured. See README to configure.');
      const user = supabase.auth.getUser();
      const session = (await supabase.auth.getSession()).data?.session;
      if (session?.user) {
        // user signed in -> show profile or sign out
        const email = session.user.email;
        if (confirm('Sign out ' + email + '?')) await signOut();
        return;
      }
      const email = prompt('Enter captain email to receive a login link (magic link):');
      if (!email) return;
      const { error } = await supabase.auth.signInWithOtp({ email });
      if (error) return alert('Login failed: ' + error.message);
      alert('Check your email for a magic link to sign in. After signing, reload the page.');
    }

    async function signOut() { if (!useSupabase) return; await supabase.auth.signOut(); isAdmin = false; document.getElementById('adminControls').classList.add('hidden'); document.getElementById('authBtn').textContent = 'Captain Login'; }

    // --- Import / Export / Clipboard ---
    async function copyRosterToClipboard() {
      const dayData = store.signups[currentDate] || { teamA: {}, teamB: {} };
      let text = `🏐 VOLLEYBALL LINEUP - ${currentDate}\n\n`;
      text += `--- TEAM BLUE ---\n`;
      POSITIONS.forEach(p => { const e = dayData.teamA[p.id]; text += `${p.name}: ${e ? e.name + (e.status === 'pending' ? ' [PENDING]' : '') : '[Open]'}\n`; });
      text += `\n--- TEAM GREEN ---\n`;
      POSITIONS.forEach(p => { const e = dayData.teamB[p.id]; text += `${p.name}: ${e ? e.name + (e.status === 'pending' ? ' [PENDING]' : '') : '[Open]'}\n`; });
      try { await navigator.clipboard.writeText(text); alert("Roster copied to clipboard!"); } catch (err) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); alert("Roster copied to clipboard (fallback)!"); } catch (e) { alert("Copy failed — you can export JSON or copy manually."); } ta.remove(); }
    }

    function downloadRoster() { const data = JSON.stringify(store, null, 2); const blob = new Blob([data], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `vb_roster_${currentDate}.json`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }

    function importRosterFile(e) { const f = e.target.files?.[0]; if (!f) return; const reader = new FileReader(); reader.onload = (ev) => { try { const imported = JSON.parse(ev.target.result); if (!imported || !imported.dates) throw new Error('Invalid format'); store = imported; migrateStore(); saveStore(); populateDateDropdown(); renderSlots(); alert('Roster imported'); } catch (err) { alert('Invalid roster file'); } }; reader.readAsText(f); e.target.value = ''; }

    // start
    init();
  </script>
</body>
</html>
